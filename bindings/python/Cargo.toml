[package]
name = "bagz-python"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Python bindings for the Bagz swipe-to-apply core"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
bagz-core = { path = "../../crates/bagz-core" }
pyo3.workspace = true

[features]
# Maturin enables this so the wheel does not link libpython.
# `cargo test` leaves it off and links the interpreter instead.
extension-module = ["pyo3/extension-module"]
