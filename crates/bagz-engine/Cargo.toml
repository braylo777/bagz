[package]
name = "bagz-engine"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Job ingestion (Greenhouse, Lever, Ashby, Workable, RSS), approval-gated agents, and ATS-safe .docx export for BAGZ"
default-run = "bagz"

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
proptest = "1"
