[package]
name = "bagz-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "PyO3 bindings for the BAGZ swipe-to-apply core"

[lib]
name = "bagz"
crate-type = ["cdylib"]

[dependencies]
# 0.29 is the newest PyO3 line whose MSRV is Rust 1.83, matching this workspace.
bagz-core = { path = "../bagz-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
