[workspace]
resolver = "3"
members = ["crates/bagz-core", "bindings/python"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
